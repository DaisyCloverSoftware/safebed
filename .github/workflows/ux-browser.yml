name: UX browser smoke

on:
  pull_request:
    paths:
      - "prototype/ux/**"
      - "scripts/browser-ux-smoke.mjs"
      - ".github/workflows/ux-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-browser-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Rendered Chrome UX regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.19.0 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Show installed browser version
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version
          elif command -v google-chrome-stable >/dev/null 2>&1; then google-chrome-stable --version
          elif command -v chromium >/dev/null 2>&1; then chromium --version
          elif command -v chromium-browser >/dev/null 2>&1; then chromium-browser --version
          else echo "No Chrome/Chromium executable found" >&2; exit 1
          fi

      - name: Run rendered synthetic UX smoke
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then real_chrome="$(command -v google-chrome)"
          elif command -v google-chrome-stable >/dev/null 2>&1; then real_chrome="$(command -v google-chrome-stable)"
          elif command -v chromium >/dev/null 2>&1; then real_chrome="$(command -v chromium)"
          else real_chrome="$(command -v chromium-browser)"
          fi

          shim_dir="$(mktemp -d)"
          trap 'rm -rf "$shim_dir"' EXIT
          cat > "$shim_dir/google-chrome" <<EOF
          #!/usr/bin/env bash
          set -uo pipefail
          real_chrome="$real_chrome"
          args=()
          for arg in "\$@"; do
            if [[ "\$arg" == "--remote-debugging-port=0" ]]; then
              args+=("--remote-debugging-port=9222")
            else
              args+=("\$arg")
            fi
          done
          "\$real_chrome" "\${args[@]}" &
          pid=\$!
          cleanup() { kill "\$pid" >/dev/null 2>&1 || true; }
          trap cleanup TERM INT EXIT
          for _ in \$(seq 1 100); do
            version="\$(curl -fsS --max-time 1 http://127.0.0.1:9222/json/version 2>/dev/null || true)"
            ws="\$(printf '%s' "\$version" | sed -n 's/.*"webSocketDebuggerUrl"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
            if [[ -n "\$ws" ]]; then
              echo "DevTools listening on \$ws" >&2
              break
            fi
            sleep 0.1
          done
          wait "\$pid"
          status=\$?
          trap - EXIT
          exit "\$status"
          EOF
          chmod 0755 "$shim_dir/google-chrome"
          PATH="$shim_dir:$PATH" node scripts/browser-ux-smoke.mjs
