name: Lockfile proof

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/lockfile-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate canonical npm lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.19.0 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Resolve canonical lockfile without running package scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo '---BEGIN SAFEBED PACKAGE LOCK---'
          cat package-lock.json
          echo '---END SAFEBED PACKAGE LOCK---'
          exit 1
