name: DEV accessibility external smoke

on:
  pull_request:
    paths:
      - ".github/workflows/dev-a11y-external-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: Verify accessibility DEV revision over public HTTPS
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact certified accessibility base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Prove expected accessibility source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_SHA" ]]
          [[ "$actual" == '44390ada67d0cea9d60041c8f1104f17d6ab9dc9' ]]

      - name: Fetch SafeBed DEV and byte-compare certified assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://dev-safebed.daisycloversoftware.uk'
          headers="$RUNNER_TEMP/headers.txt"
          html="$RUNNER_TEMP/index.html"
          app="$RUNNER_TEMP/app.js"

          code="$(curl --silent --show-error --location --max-time 20 --connect-timeout 10 \
            --dump-header "$headers" --output "$html" --write-out '%{http_code}' "$base/")"
          [[ "$code" == '200' ]]
          grep -Eiq '^content-type:[[:space:]]*text/html' "$headers"
          grep -Fq 'SafeBed synthetic UX prototype' "$html"
          grep -Fq 'No real services, people or locations are shown.' "$html"

          app_code="$(curl --silent --show-error --location --max-time 20 --connect-timeout 10 \
            --output "$app" --write-out '%{http_code}' "$base/app.js")"
          [[ "$app_code" == '200' ]]

          cmp --silent prototype/ux/index.html "$html" || {
            echo 'DEV index.html does not match the certified accessibility source.' >&2
            echo "expected=$(sha256sum prototype/ux/index.html | awk '{print $1}')" >&2
            echo "served=$(sha256sum "$html" | awk '{print $1}')" >&2
            exit 1
          }
          cmp --silent prototype/ux/app.js "$app" || {
            echo 'DEV app.js does not match the certified accessibility source.' >&2
            echo "expected=$(sha256sum prototype/ux/app.js | awk '{print $1}')" >&2
            echo "served=$(sha256sum "$app" | awk '{print $1}')" >&2
            exit 1
          }

          echo "SafeBed DEV accessibility revision verified externally: exact certified index.html and app.js are served over HTTPS."
