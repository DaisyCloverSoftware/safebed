name: Synthetic sandbox

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "api/openapi.v0.2.json"
      - "api/README.md"
      - "docs/safebed-availability-protocol-v0.2.md"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/synthetic-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-sandbox-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.19.0 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Install exact discovery dependency
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Run synthetic safety and contract regression suite
        run: npm test

      - name: Run strict TypeScript check
        run: npm run typecheck
